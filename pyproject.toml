[project]
name = "aeiou-poc"
version = "0.1.0"
description = "AEIOU PoC backend (구 VoiceUp) — Korean speaking coach, hypothesis-validation build"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "kiwipiepy>=0.17",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Needed only for the real-API verification scripts (demo_run.py, eval_*.py).
# The mocked pytest suite does NOT require these.
realapi = [
    "anthropic>=0.40",
    "openai>=1.40",
]
# Optional heavier signal-processing backend. F0 defaults to a pure-numpy
# autocorrelation estimator; install this to enable compute_f0_stats(method="pyin").
audio = [
    "librosa>=0.10",
]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.routes",
    "app.conversation",
    "app.analysis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
